services:
  - type: web
    name: betting-analytics
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -e ".[dev]" && python scripts/bootstrap_data.py
    startCommand: uvicorn src.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_RENDER_DAILY_PIPELINE
        value: "true"
      - key: RUN_PIPELINE_ON_STARTUP
        value: "false"
      - key: RUN_RENDER_SMOKE_BEFORE_PIPELINE
        value: "false"
      - key: RENDER_DAILY_SIGNAL_UTC
        value: "08:15"
      - key: SCHEDULED_SEND_TELEGRAM
        value: "false"
      - key: LIVE_SPORT_KEYS
        value: "soccer_epl"
      - key: LEAGUES
        value: "E0,SP1,D1,I1,F1"
      - key: SEASONS
        value: "2122,2223,2324,2425,2526"
      - key: THE_ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Telegram userbot collector (Telethon)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STR
        sync: false
      - key: TELEGRAM_CHANNELS
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
