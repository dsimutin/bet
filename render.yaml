# render.yaml — Render Blueprint для Sports Betting Analytics MVP
# Документация: https://render.com/docs/blueprint-spec
#
# АРХИТЕКТУРА (Active Mode — единый Web Service):
#   Все задачи запускаются внутри Web Service через APScheduler (ACTIVE_MODE=true).
#   Отдельные Cron Job сервисы не нужны — это упрощает конфигурацию и экономит ресурсы.
#
# Schedule (APScheduler, UTC):
#   0  */3 * * *  signal_scan     — проверка матчей, генерация сигналов, Telegram-алерты
#   20 */3 * * *  settlement      — закрытие завершившихся ставок, CUSUM drift check
#   40 */3 * * *  training_check  — умное переобучение (только если MIN_NEW_SETTLED достигнут)
#   50 */3 * * *  active_report   — 3-часовой Telegram-отчёт о состоянии бота
#
# Для ручного запуска или аварийного переключения отдельные entrypoints доступны как:
#   python -m src.cron.run_signals
#   python -m src.cron.run_settle
#   python -m src.cron.run_trainer
#   python -m src.cron.run_active_report

version: "1"

services:

  # ──────────────────────────────────────────────────────────────────
  # WEB SERVICE — FastAPI + APScheduler (active monitoring mode)
  # Одиночный сервис: health API + встроенный планировщик задач.
  # plan: free     — бесплатно, усыпает при простое (keep-alive job решает это)
  # plan: starter  — $7/мес, усыпает при простое, 512 MB RAM
  # plan: standard — $25/мес, не усыпает, рекомендуется для production
  # ──────────────────────────────────────────────────────────────────
  - type: web
    name: bet-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements-render.txt && pip install -e . --no-deps
    startCommand: uvicorn src.web.health_app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    branch: all-the-best

    disk:
      name: bet-data-disk
      mountPath: /data
      sizeGB: 10

    envVars:
      # ── Пути (абсолютные на Render) ──
      - key: DATA_DIR
        value: /data
      - key: MODEL_DIR
        value: /data/models
      - key: LEDGER_PATH
        value: /data/core/paper_signal_ledger.json
      - key: STAGING_DIR
        value: /data/staging
      - key: REPORTS_DIR
        value: /data/reports

      # ── Лиги и сезоны ──
      - key: LEAGUES
        value: "EPL,BUNDESLIGA,LALIGA,SERIEA"
      - key: OPENFOOTBALL_SEASONS
        value: "2021-22,2022-23,2023-24,2024-25"

      # ── Active mode scheduler ──
      - key: ACTIVE_MODE
        value: "true"
      - key: ACTIVE_REPORT_INTERVAL_HOURS
        value: "3"
      - key: SIGNAL_SCAN_INTERVAL_HOURS
        value: "3"
      - key: SETTLEMENT_INTERVAL_HOURS
        value: "3"
      - key: TRAINING_CHECK_INTERVAL_HOURS
        value: "3"
      - key: FORCE_TRAINING
        value: "false"
      - key: MIN_NEW_SETTLED_MATCHES_FOR_TRAINING
        value: "10"
      - key: TELEGRAM_STATUS_REPORTS_ENABLED
        value: "true"
      - key: TELEGRAM_SIGNAL_ALERTS_ENABLED
        value: "true"
      - key: SPORTS
        value: "football"

      # ── PostgreSQL ──
      - key: DATABASE_URL
        fromDatabase:
          name: bet-db
          property: connectionString

      # ── Telegram (заполнить в Dashboard → Environment) ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STR
        sync: false
      - key: TELEGRAM_CHANNELS
        sync: false

      # ── The Odds API ──
      - key: THE_ODDS_API_KEY
        sync: false

      # ── Режим работы ──
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /opt/render/project/src

# ──────────────────────────────────────────────────────────────────
# POSTGRESQL — метаданные, аудит-лог, история drift-отчётов
# ──────────────────────────────────────────────────────────────────
databases:
  - name: bet-db
    plan: free
    region: frankfurt
    databaseName: bet
    user: bet_user
    postgresMajorVersion: "16"
