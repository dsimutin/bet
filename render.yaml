# render.yaml — Render Blueprint for the unified football + tennis analytics bot
#
# Free-tier architecture:
# - FastAPI + APScheduler run inside one free Render Web Service.
# - Supabase PostgreSQL stores the persistent paper ledger and shared Odds API cache.
# - Local files remain disposable mirrors only.
# - GitHub Actions wakes the service externally before scheduled runtime windows.
# - No paid persistent disk is required.
#
# APScheduler windows (UTC):
# - 06:15 tennis data refresh
# - 06:20 Monday tennis retrain
# - 06:40 football training check
# - 07:00 and 15:00 unified football + tennis scans
# - 07:10 and 15:10 detailed Telegram digests
# - 07:30, 15:30 and 22:30 settlement

version: "1"

services:
  - type: web
    name: bet-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements-render.txt && pip install -e . --no-deps
    startCommand: uvicorn src.web.health_app:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    healthCheckPath: /health
    autoDeploy: true
    branch: all-the-best

    envVars:
      # Disposable local mirrors
      - key: DATA_DIR
        value: data
      - key: MODEL_DIR
        value: data/models
      - key: LEDGER_PATH
        value: data/core/paper_signal_ledger.json
      - key: STAGING_DIR
        value: data/staging
      - key: REPORTS_DIR
        value: data/reports

      # Football leagues and seasons
      - key: LEAGUES
        value: "EPL,BUNDESLIGA,LALIGA,SERIEA,LIGUE1"
      - key: OPENFOOTBALL_SEASONS
        value: "2022-23,2023-24,2024-25,2025-26"

      # Supabase PostgreSQL persistent runtime state (required in production)
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: "production"
      - key: SUPABASE_LEDGER_ENABLED
        value: "true"
      - key: REQUIRE_DATABASE
        value: "true"
      - key: ALLOW_LOCAL_LEDGER_FALLBACK
        value: "false"
      - key: WRITE_LOCAL_LEDGER_MIRROR
        value: "true"

      # Shared low-quota Odds API cache
      - key: FOOTBALL_ODDS_REGIONS
        value: "eu"
      - key: TENNIS_ODDS_REGIONS
        value: "eu"
      - key: TENNIS_MAX_ACTIVE_KEYS
        value: "2"
      - key: ODDS_CACHE_TTL_SECONDS
        value: "28800"
      - key: CACHE_STORAGE_TTL_SECONDS
        value: "28800"
      - key: PRIORITY_ODDS_MAX_AGE_SECONDS
        value: "900"
      - key: WATCHLIST_ODDS_MAX_AGE_SECONDS
        value: "3600"
      - key: EXOTIC_WATCHLIST_ODDS_MAX_AGE_SECONDS
        value: "14400"
      - key: THE_ODDS_API_MIN_REMAINING_HARD_STOP
        value: "25"
      - key: THE_ODDS_API_MIN_REMAINING_PRIORITY_REFRESH
        value: "50"
      - key: QUOTA_STATE_BACKEND
        value: "database"

      # Unified runtime schedule (UTC)
      - key: RUNTIME_SCAN_HOURS_UTC
        value: "7,15"
      - key: SETTLEMENT_HOURS_UTC
        value: "7,15,22"
      # Runtime mode
      - key: ACTIVE_MODE
        value: "true"
      - key: FORCE_TRAINING
        value: "false"
      - key: MIN_NEW_SETTLED_MATCHES_FOR_TRAINING
        value: "10"
      - key: TELEGRAM_STATUS_REPORTS_ENABLED
        value: "true"
      - key: TELEGRAM_SIGNAL_ALERTS_ENABLED
        value: "true"
      - key: SPORTS
        value: "football,tennis"
      - key: ENABLE_TENNIS_SPREADS
        value: "false"
      - key: ENABLE_TENNIS_TOTALS
        value: "false"

      # Configure secrets in Render Dashboard -> Environment
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: TELEGRAM_MANUAL_REFRESH_COOLDOWN_SECONDS
        value: "300"
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      - key: THE_ODDS_API_KEY
        sync: false
      # Tennis: odds-api.io (free, no IP restrictions). Register at https://odds-api.io/
      # Free tier: 100 req/hour, 2 bookmakers. Tennis ATP/WTA supported.
      - key: ODDS_API_IO_KEY
        sync: false
      # Bookmakers for odds-api.io free tier (max 2, comma-separated slugs)
      - key: ODDS_API_IO_BOOKMAKERS
        value: "singbet,bet365"

      # Safety
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /opt/render/project/src
