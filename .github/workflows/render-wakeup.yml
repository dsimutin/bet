name: Wake Render free service

on:
  schedule:
    # Wake before tennis refresh / training check
    - cron: "5 6 * * *"
    # Wake before unified scans
    - cron: "50 6 * * *"
    - cron: "50 14 * * *"
    # Wake before late settlement
    - cron: "20 22 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service
        env:
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          if [ -z "$RENDER_EXTERNAL_URL" ]; then
            echo "RENDER_EXTERNAL_URL secret is not configured"
            exit 1
          fi
          curl --fail --show-error --silent --retry 5 --retry-delay 10 --max-time 60 \
            "${RENDER_EXTERNAL_URL%/}/health"
