name: Keep Render Alive

on:
  # Manual-only fallback. Production wakeups are owned by render-wakeup.yml,
  # which pings the service shortly before cron windows instead of burning
  # GitHub/Render free-tier minutes around the clock.
  workflow_dispatch:

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          if [ -z "$RENDER_EXTERNAL_URL" ]; then
            echo "RENDER_EXTERNAL_URL secret is not configured"
            exit 1
          fi
          curl --fail --show-error --silent --retry 5 --retry-delay 10 --max-time 60 \
            "${RENDER_EXTERNAL_URL%/}/health"
