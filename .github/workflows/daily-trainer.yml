name: Daily Model Trainer

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated league codes (EPL,BUNDESLIGA,LALIGA,SERIEA)"
        default: "EPL,BUNDESLIGA,LALIGA,SERIEA"
        required: true
      cutoff_date:
        description: "YYYY-MM-DD cutoff date (leave empty for today)"
        default: ""
        required: false
      openfootball_seasons:
        description: "OpenFootball seasons"
        default: "2021-22,2022-23,2023-24,2024-25"
        required: true
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
      - master
      - "integration/**"
      - "claude/**"
    paths:
      - "src/models/**"
      - "scripts/bootstrap_data.py"
      - "configs/**"

concurrency:
  group: model-registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    name: Train Dixon-Coles — ${{ matrix.league }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        league: [EPL, BUNDESLIGA, LALIGA, SERIEA]
      fail-fast: false   # train remaining leagues even if one fails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Skip if league not in inputs
        id: check_league
        run: |
          REQUESTED="${{ github.event.inputs.leagues || 'EPL,BUNDESLIGA,LALIGA,SERIEA' }}"
          if echo "$REQUESTED" | grep -qw "${{ matrix.league }}"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "League ${{ matrix.league }} not requested — skipping."
          fi

      - name: Run trainer
        if: steps.check_league.outputs.skip == 'false'
        env:
          LEAGUE: ${{ matrix.league }}
          CUTOFF_DATE: ${{ github.event.inputs.cutoff_date || '' }}
          OPENFOOTBALL_SEASONS: ${{ github.event.inputs.openfootball_seasons || '2021-22,2022-23,2023-24,2024-25' }}
        run: |
          cutoff_args=()
          if [ -n "$CUTOFF_DATE" ]; then
            cutoff_args=(--cutoff-date "$CUTOFF_DATE")
          fi
          uv run --extra dev python -m src.models.run_daily_trainer \
            --league "$LEAGUE" \
            "${cutoff_args[@]}" \
            --download-openfootball \
            --openfootball-leagues "$LEAGUE" \
            --openfootball-seasons "$OPENFOOTBALL_SEASONS" \
            --model-dir data/models \
            --output-dir data/reports

      - name: Upload training artifacts
        if: always() && steps.check_league.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: daily-model-training-${{ matrix.league }}
          if-no-files-found: ignore
          path: |
            data/models/dc_${{ matrix.league }}_*.pkl
            data/models/dc_${{ matrix.league }}_*.meta.json
            data/models/calibration_dc_${{ matrix.league }}_*.pkl
            data/reports/daily_training_*.json

      - name: Validate model quality gate
        if: steps.check_league.outputs.skip == 'false'
        run: |
          uv run --extra dev python - <<'EOF'
          import json, sys, pathlib, glob

          league = "${{ matrix.league }}"
          meta_files = sorted(glob.glob(f"data/models/dc_{league}_*.meta.json"))
          if not meta_files:
              print(f"No model metadata for {league} — skipping quality gate.")
              sys.exit(0)

          latest = meta_files[-1]
          meta = json.loads(pathlib.Path(latest).read_text())

          converged = meta.get("converged", True)
          brier = meta.get("brier_score")
          status = meta.get("status", "candidate")

          print(f"[{league}] {meta.get('model_id')}  status={status}  brier={brier}  converged={converged}")

          errors = []
          if brier is not None and float(brier) > 0.70:
              errors.append(f"brier_score {brier:.4f} exceeds hard ceiling 0.70")
          if converged is False:
              errors.append("optimizer did not converge")

          if errors:
              print(f"[{league}] Quality gate FAILED:", "; ".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"[{league}] Quality gate passed.")
          EOF

  # Fan-in: runs once after ALL parallel train jobs finish.
  # This serialises the single git commit so there is no push race.
  persist-all:
    name: Persist all model state
    runs-on: ubuntu-latest
    needs: [train]
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all training artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: daily-model-training-*
          merge-multiple: true
          path: .

      - name: Commit and push model state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_files=()
          for pattern in "data/models/dc_*.pkl" \
                         "data/models/dc_*.meta.json" \
                         "data/models/calibration_dc_*.pkl" \
                         "data/reports/daily_training_*.json"; do
            while IFS= read -r path; do
              state_files+=("$path")
            done < <(compgen -G "$pattern" || true)
          done

          if [ ${#state_files[@]} -eq 0 ]; then
            echo "No model state files found."
            exit 0
          fi

          git add -f "${state_files[@]}"
          if git diff --cached --quiet; then
            echo "No model state changes to persist."
            exit 0
          fi

          git pull --rebase
          git commit -m "chore: persist daily model state [all leagues]"
          git push
