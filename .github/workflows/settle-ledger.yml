name: Settle Signal Ledger

# Runs after European matches finish (23:00 UTC) and on demand.
# Downloads latest OpenFootball results, settles open signals, commits updated ledger.
# After settlement, triggers model retrain to close the feedback loop:
#   match finished → ledger settled → model retrains → next signal is smarter.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "League codes to fetch results for"
        default: "EPL,BUNDESLIGA,LALIGA,SERIEA"
        required: true
      seasons:
        description: "OpenFootball seasons"
        default: "2023-24,2024-25"
        required: true
      skip_retrain:
        description: "Skip post-settlement model retrain"
        default: "false"
        required: false
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: settle-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    name: Settle open signals
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Download latest results and settle ledger
        env:
          LEAGUES: ${{ github.event.inputs.leagues || 'EPL,BUNDESLIGA,LALIGA,SERIEA' }}
          SEASONS: ${{ github.event.inputs.seasons || '2023-24,2024-25' }}
        run: |
          # Download latest results from OpenFootball (no API key needed)
          uv run --extra dev python - <<'PYEOF'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, str(Path(".").resolve()))

          from src.ingest.openfootball import OpenFootballLoader

          leagues = os.environ["LEAGUES"].split(",")
          seasons = os.environ["SEASONS"].split(",")
          staging = Path("data/staging")
          staging.mkdir(parents=True, exist_ok=True)

          loader = OpenFootballLoader()
          result = loader.build(leagues=leagues, seasons=seasons, use_cache=False)
          if result.dataframe.empty:
              print("No results downloaded — nothing to settle.", flush=True)
              sys.exit(0)

          csv_path = loader.save_combined(result.dataframe, staging, "latest_results.csv")
          print(f"Downloaded {len(result.dataframe)} matches → {csv_path}", flush=True)
          PYEOF

      - name: Settle open signals in ledger
        run: |
          if [ ! -f data/staging/latest_results.csv ]; then
            echo "No results file — skipping settlement."
            exit 0
          fi
          uv run --extra dev python -m src.models.settle_signal_ledger \
            --ledger-path data/core/paper_signal_ledger.json \
            --results-input data/staging/latest_results.csv \
            --report-path data/reports/signal_ledger_settlement_report.json

      - name: Upload settlement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-report
          if-no-files-found: ignore
          path: data/reports/signal_ledger_settlement_report.json

      - name: Run drift detector after settlement
        run: |
          uv run --extra dev python - <<'PYEOF'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".").resolve()))
          from src.monitoring.drift_detector import CUSUMDriftDetector

          detector = CUSUMDriftDetector(threshold=0.15, drift_window=14, min_window=10)
          ledger_path = Path("data/core/paper_signal_ledger.json")
          report = detector.evaluate_ledger_path(ledger_path)

          output_path = Path("data/reports/drift_report.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(report.to_dict(), indent=2, ensure_ascii=False), encoding="utf-8"
          )

          status = "DRIFT DETECTED" if report.drift_detected else "no drift"
          print(f"[drift-detector] {status} | recent={report.recent_accuracy} "
                f"baseline={report.baseline_accuracy} kelly_mult={report.kelly_multiplier}")
          print(f"[drift-detector] reason: {report.reason}")

          if report.drift_detected:
              print("::warning::Concept drift detected — model retrain triggered automatically.")
          PYEOF

      - name: Settlement summary notification
        if: always()
        run: |
          LEDGER="data/core/paper_signal_ledger.json"
          REPORT="data/reports/signal_ledger_settlement_report.json"
          DRIFT="data/reports/drift_report.json"

          SETTLED=0
          TOTAL=0
          if [ -f "$REPORT" ]; then
            SETTLED=$(python3 -c "import json; d=json.load(open('$REPORT')); print(d.get('settled_count', 0))" 2>/dev/null || echo 0)
            TOTAL=$(python3 -c "import json; d=json.load(open('$REPORT')); print(d.get('total_processed', 0))" 2>/dev/null || echo 0)
          elif [ -f "$LEDGER" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$LEDGER')); print(len(d.get('entries', [])))" 2>/dev/null || echo 0)
          fi

          DRIFT_STATUS="unknown"
          KELLY_MULT="1.0"
          if [ -f "$DRIFT" ]; then
            DRIFT_STATUS=$(python3 -c "import json; d=json.load(open('$DRIFT')); print('DRIFT' if d.get('drift_detected') else 'OK')" 2>/dev/null || echo "unknown")
            KELLY_MULT=$(python3 -c "import json; d=json.load(open('$DRIFT')); print(d.get('kelly_multiplier', 1.0))" 2>/dev/null || echo "1.0")
          fi

          echo "======================================"
          echo " SETTLEMENT SUMMARY $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "======================================"
          echo " Settled bets  : $SETTLED"
          echo " Total in ledger: $TOTAL"
          echo " Drift status  : $DRIFT_STATUS"
          echo " Kelly mult    : $KELLY_MULT"
          echo "======================================"

          if [ "$DRIFT_STATUS" = "DRIFT" ]; then
            echo "::warning::Model drift detected — Kelly reduced to ${KELLY_MULT}x. Retrain triggered."
          fi

      - name: Persist updated ledger and drift report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_files=()
          for path in data/core/paper_signal_ledger.json \
                      data/reports/signal_ledger_settlement_report.json \
                      data/reports/drift_report.json; do
            [ -f "$path" ] && state_files+=("$path")
          done

          if [ ${#state_files[@]} -eq 0 ]; then
            echo "No ledger files to persist."
            exit 0
          fi

          git add -f "${state_files[@]}"
          if git diff --cached --quiet; then
            echo "No ledger changes — all signals already settled."
            exit 0
          fi

          git pull --rebase
          git commit -m "chore: settle open signals [$(date -u +%Y-%m-%d)]"
          git push

  # ---------------------------------------------------------------
  # Feedback loop: retrain the model right after settlement so that
  # the next day's signals already incorporate today's results.
  # Skipped if no new signals were settled or skip_retrain=true.
  # ---------------------------------------------------------------
  retrain-after-settlement:
    name: Retrain model (post-settlement feedback loop)
    needs: settle
    if: >
      success() &&
      github.event.inputs.skip_retrain != 'true'
    uses: ./.github/workflows/daily-trainer.yml
    with:
      leagues: ${{ github.event.inputs.leagues || 'EPL,BUNDESLIGA,LALIGA,SERIEA' }}
      cutoff_date: ""
      openfootball_seasons: "2021-22,2022-23,2023-24,2024-25"
      triggered_by: "settle-ledger"
    permissions:
      contents: write
